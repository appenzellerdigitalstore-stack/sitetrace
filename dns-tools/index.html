<body class="min-h-screen bg-ink-900 text-slate-100 font-sans antialiased selection:bg-brand-500/40 selection:text-white">
  <div id="site-bg"></div>
  <div id="site-header"></div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-20">
    <section class="pt-8 sm:pt-12 space-y-4">
      <nav class="text-xs text-slate-500" aria-label="Breadcrumb">
        <a href="/" class="hover:text-slate-300">SiteTrace</a>
        <span class="mx-1.5">/</span>
        <span data-i18n="nav_dns">DNS Tools</span>
      </nav>
      <div class="text-center max-w-2xl mx-auto space-y-3">
        <p class="text-xs sm:text-sm font-semibold tracking-[0.2em] uppercase text-brand-300" data-i18n="nav_dns">DNS Tools</p>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400" data-i18n="dns_title">DNS &amp; routing tools</h1>
        <p class="text-slate-400 text-sm sm:text-base" data-i18n="dns_subtitle">Resolve domains, inspect records, and see which resolver answered.</p>
      </div>
    </section>

    <div class="card mt-8">
      <form id="dns-form" class="grid sm:grid-cols-[1fr_auto_auto] gap-3">
        <label class="block">
          <span class="sr-only" data-i18n="dns_input_label">Domain or hostname</span>
          <input id="dns-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full bg-ink-700 border border-white/10 rounded-lg px-4 py-3 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50" data-i18n-attr="placeholder:dns_input_placeholder;aria-label:dns_input_label" />
        </label>
        <select id="dns-type" class="bg-ink-700 border border-white/10 rounded-lg px-3 py-3 text-sm">
          <option value="A">A</option>
          <option value="AAAA">AAAA</option>
          <option value="MX">MX</option>
          <option value="TXT">TXT</option>
          <option value="NS">NS</option>
          <option value="CNAME">CNAME</option>
          <option value="SOA">SOA</option>
        </select>
        <button type="submit" class="btn-primary">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span data-i18n="dns_lookup">Lookup</span>
        </button>
      </form>
    </div>

    <div id="dns-result-card" class="card mt-5 hidden">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <div class="text-xs text-slate-500" data-i18n="dns_result">Result</div>
          <div id="dns-target" class="text-lg font-mono font-semibold"></div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-500" data-i18n="dns_resolver">Answered by</div>
          <div id="dns-resolver" class="text-sm font-medium text-brand-300"></div>
          <div class="text-xs text-slate-500 mt-1"><span data-i18n="dns_ttl">TTL</span>: <span id="dns-ttl" class="font-mono"></span></div>
        </div>
      </div>
      <ul id="dns-answers" class="space-y-2"></ul>
    </div>

    <div id="dns-empty" class="card text-center text-slate-500 py-10 mt-5" data-i18n="dns_empty">Enter a domain to begin.</div>

    <section class="mt-12 card">
      <h2 class="text-base font-bold mb-3">More tools</h2>
      <div class="flex flex-wrap gap-3 text-sm">
        <a href="/what-is-my-ip/" class="text-brand-300 hover:text-brand-200">What is my IP →</a>
        <a href="/ping/" class="text-brand-300 hover:text-brand-200">Ping test →</a>
        <a href="/" class="text-brand-300 hover:text-brand-200">All tools</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
