# Cloudflare Pages configuration for SiteTrace
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "sitetrace"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# No build step — site is plain static files. Cloudflare Pages serves them as-is.
# The "site" is the project root (index.html + styles.css + js/).
